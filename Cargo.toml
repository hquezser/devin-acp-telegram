[package]
name = "devin-acp-telegram"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Remote-control Devin CLI from Telegram: one forum topic per session, live status, permission buttons, mid-turn messages — over the Agent Client Protocol."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hquezser/devin-acp-telegram"
keywords = ["devin", "telegram", "acp", "coding-agent", "remote-control"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt", "macros", "process", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.47", features = ["net", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
